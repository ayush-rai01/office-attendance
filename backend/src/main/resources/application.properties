spring.application.name=office-attendance-backend

# MySQL Database Connection (Supports environment variables for cloud deployment with local fallback)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/office_attendance_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Palak123}

# JPA / Hibernate Auto-DDL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Server Port (Supports Cloud PORT env var e.g. on Render/Railway/Heroku)
server.port=${PORT:8080}
